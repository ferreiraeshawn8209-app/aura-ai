name: Android build and unit tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # This repository has no checked-in gradle-wrapper.jar. Install the
      # pinned Gradle version directly until a validated wrapper is committed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Build Android APK and run unit tests
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
